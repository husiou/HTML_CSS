<!-- thing on left is css property-->

<head>
<style>
    .subscribe-button {
        background-color: rgb(204, 0, 0);
        color: white;
        border: none;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 16px;
        padding-right: 16px;
        border-radius: 2px;
        cursor: pointer;
        margin-right: 8px;
        transition: opacity 0.5s;
        vertical-align: top;
    }

    .subscribe-button:hover {
        opacity: 0.8;
    }

    .subscribe-button:active {
        opacity: 0.4;
    }
    .join-button {
        background-color: white;
        color: rgb(102, 157, 240);
        border-color: rgb(102,157,240);
        border-style: solid;
        border-width: 1px;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 16px;
        padding-right: 16px;
        border-radius: 2px;
        cursor: pointer;
        transition: background-color 1s,
        color 1s;
        vertical-align: top;
    }

    .join-button:hover {
        background-color: rgb(102, 157, 240);
        color: white;
    }

    .join-button:active {
        opacity: 0.7;
    }

    .tweet-button {
        background-color: rgb(67, 118, 226);
        color: white;
        border: none;
        border-radius: 20px;
        padding-right: 20px;
        padding-left: 20px;
        padding-top: 7px;
        padding-bottom: 7px;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        margin-left: 8px;
        transition: box-shadow 0.15s;
        vertical-align: top;
    }

    .tweet-button:hover {
        box-shadow: 10px 10px 10px rgba(0,0,0,0.6);

    }
</style>
</head>
<body>
    <button class="subscribe-button">
        Subscribe</button>
    <button class="join-button">
        Join</button>
    <button class="tweet-button">
        Tweet</button>
</body>
