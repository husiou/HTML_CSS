<!-- thing on left is css property-->

<head>
<style>
    .subscribe-button {
        background-color: rgb(202, 0, 0);
        color: white;
        border: none;
        height: 36px;
        width: 100px;
        border-radius: 2px;
        cursor: pointer;
        margin-right: 8px;
    }
    .join-button {
        background-color: white;
        color: rgb(102, 157, 240);
        border-color: rgb(102,157,240);
        border-style: solid;
        border-width: 1px;
        height: 36px;
        width: 62px;
        border-radius: 2px;
        cursor: pointer;
    }
    .tweet-button {
        background-color: rgb(67, 118, 226);
        color: white;
        border: none;
        height: 36px;
        border-radius: 20px;
        width: 74px;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        margin-left: 8px;
        
    }
</style>
</head>
<body>
    <button class="subscribe-button">
        Subscribe</button>
    <button class="join-button">
        Join</button>
    <button class="tweet-button">
        Tweet</button>
</body>
