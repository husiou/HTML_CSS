<head>
    <style>
    .uber {
        display: block;
        background-color: black;
        color: white;
        height: 36px;
        width: 100px;
        margin-bottom: 10px;
        
    }

    .uber:hover {
        opacity: 0.7;
    }
    .amazon {
        display: block;
        background-color: rgb(255,216,20);
        color: black;
        border-style: solid;
        border-radius: 15px;
        border-color: rgb(255,216,20);
        width: 120px;
        height: 30px;
        margin-bottom: 10px;
    }

    .amazon:hover {
        background-color: rgb(201, 135, 13);
    }
    .github {
        display: block;
        background-color: rgb(46,164,79);
        color: white;
        border-radius: 12px;
        border-style: none;
        width: 80px;
        height: 36px;
        margin-bottom: 10px;
        font-weight: bold;
    }

    .github:hover {
        box-shadow: 5px 5px 5px rgba(0,0,0,0.5);
    }
    .bootstrap {
        background-color: rgb(121,82,179);
        color: white;
        border-radius: 10px;
        width: 100px;
        height: 40px;
        margin-bottom: 10px;
        border-style: none;
        font-weight: bold;
    }

    .bootstrap:hover {
        background-color: rgb(97, 9, 97);
    }
    .bootstrap-download {
        background-color: white;
        color: rgb(108,117,125);
        border-color: rgb(108,117,125);
        border-radius: 10px;
        width: 100px;
        height: 40px;
        border-width: 2px;
    }

    .bootstrap-download:hover {
        background-color:rgb(63, 63, 63);
        color: white;
    }
    .linkedin {
        display: inline-block;
        background-color: rgb(10,102,194);
        color: white;
        border-radius: 15px;
        width: 200px;
        height: 30px;
        margin-bottom: 10px;
        border-style: none;
        font-weight: bold;
    }

    .linkedin:hover {
        background-color:darkblue;
    }
    .linkedin-save {
        background-color: white;
        color: rgb(10,102,194);
        border-radius: 15px;
        width: 70px;
        height: 30px;
        border-color: rgb(10,102,194);
        border-width: 0.5px;
        font-weight: bold;
    }

    .linkedin-save:hover {
        background-color:rgb(112, 171, 211);
        border-width: 3px;
    }
    .amazon-link:hover {
        color:orange;
    }

    .shoe-name {
        font-size: 20px;
        font-weight: bold;
    }
    .shoe-price {
        color: green;
    }
    .delivery {
        color:black;
    }
    .add {
        background-color: yellow;
        border-radius: 10px;
        border-style: none;
        width: 100px;
        height: 36px;
        cursor: pointer;
    }

    .add:hover {
        background-color: rgb(255, 174, 53);
    }
    .add:active {
        opacity: 0.7;
    }
    .buy {
        background-color: orange;
        border-radius: 10px;
        border-style: none;
        width: 100px;
        height: 36px;
        cursor: pointer;
    }

    .buy:hover {
        background-color:rgb(235, 153, 2);
    }

    .buy:active {
        opacity: 0.7;
    }
    </style>
</head>

<body>
    <button class="uber">
        Request now
    </button>
    <button class="amazon">
        Add to Cart
    </button>
    <button class="github">
        Sign up
    </button>
    <button class="bootstrap">
        Get started
    </button>
    <button class="bootstrap-download">
        Download
    </button>
    <button class="linkedin">
        Apply on company website
    </button>
    <button class="linkedin-save">
        Save
    </button>
    <a class="amazon-link" href="https://amazon.com">
        <br>Back to Amazon
    </a>
    <p class="shoe-name">
        Nike Black Running Shoes</p>
    <p class="shoe-price">$39 - in stock</p>
    <p class="delivery">Free delivery tommorow.</p>
    <button class="add">Add to Cart</button>
    <button class="buy">Buy now</button>
</body>
